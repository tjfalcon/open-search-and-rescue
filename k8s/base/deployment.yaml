apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-search-and-rescue
  labels:
    app.kubernetes.io/name: open-search-and-rescue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: open-search-and-rescue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-search-and-rescue
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/tjfalcon/open-search-and-rescue:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
